version: 2
updates:
  # Minor/patch bumps arrive as one grouped PR per week; majors get their own
  # PR so a breaking change is never buried in a batch.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  # discover.yml pins action versions; these go stale silently otherwise.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
