name: SF hackathon discovery

on:
  workflow_dispatch:
  schedule:
    # Fires at every UTC hour that can be 8am or 8pm Pacific across PST/PDT;
    # the gate job below keeps only the runs where it actually is.
    - cron: "0 3,4,15,16 * * *"

concurrency:
  group: discover
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Only proceed at 8am/8pm Pacific (or manual dispatch)
        id: check
        run: |
          hour=$(TZ=America/Los_Angeles date +%H)
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$hour" = "08" ] || [ "$hour" = "20" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping: $hour:00 Pacific is not a sweep slot."
          fi

  discover:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: "96011880ddcfd82df7004a95257baf66"
      LUMA_API_KEY: ${{ secrets.LUMA_API_KEY }}
      # All optional. Search discovery works without any of them by rotating a
      # couple of queries per run through DuckDuckGo, which stays under its
      # rate limit; a key just allows more queries per sweep.
      SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Sweep Luma and normalize events
        run: npm run discover:sf
        env:
          # Search discovery sleeps between queries; keep it modest in CI so it
          # cannot eat the job's time budget.
          SEARCH_DELAY_MS: "8000"
      - name: Sync events to Luma calendar (needs LUMA_API_KEY)
        if: env.LUMA_API_KEY != ''
        run: node scripts/sync-luma-calendar.mjs
      # Committed by hand rather than via git-auto-commit-action so the push
      # can rebase and retry: if another sweep (or a local push) lands while
      # this one is crawling, a plain push is rejected as non-fast-forward and
      # the whole run fails with fresh data already in hand.
      - name: Commit refreshed data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            echo "changes_detected=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "data: refresh SF hackathon discovery"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "changes_detected=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push rejected (attempt $attempt); rebasing onto origin/main."
            git pull --rebase --autostash origin main
          done
          echo "Could not push after 3 attempts." >&2
          exit 1
      # Deploy on its own merits: the site should reflect the sweep even when a
      # concurrent run already committed identical data.
      - name: Deploy site + calendar feed (needs CLOUDFLARE_API_TOKEN)
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx vinext deploy
