name: SF hackathon discovery

on:
  workflow_dispatch:
  schedule:
    # Every UTC hour that can be 8am or 8pm Pacific across PST/PDT. These are
    # only a supply of chances to run: the gate decides from how long it has been
    # since the last real sweep, so it does not matter which of them fires, how
    # late it arrives, or whether GitHub is still running an older registered
    # schedule. Extra fires are cheap — a suppressed one costs about 15 seconds.
    #
    # Split into four rather than "0 3,4,15,16 * * *" only because separate
    # entries read more clearly and make github.event.schedule useful in the log.
    # Nothing branches on it.
    - cron: "0 3 * * *"    # 8pm PDT
    - cron: "0 4 * * *"    # 8pm PST
    - cron: "0 15 * * *"   # 8am PDT
    - cron: "0 16 * * *"   # 8am PST

permissions:
  contents: write
  # The failure notifier below files an issue, which is what actually reaches a
  # phone. Without this it silently cannot.
  issues: write

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
      slot: ${{ steps.check.outputs.slot }}
    steps:
      - uses: actions/checkout@v4
      - name: Sweep twice a day, however late the trigger arrives
        id: check
        env:
          # Only for the log — nothing branches on it any more. See below.
          FIRED_CRON: ${{ github.event.schedule }}
        run: |
          # Gate on WHEN WE LAST ACTUALLY SWEPT, not on the trigger.
          #
          # Two earlier designs both failed, for opposite reasons:
          #
          #   1. Matching the Pacific hour at execution time. GitHub delivers
          #      these runs 50-110 minutes late, so a one-hour window is missed
          #      every time. Every scheduled run from Aug 3-6 2026 skipped.
          #   2. Matching github.event.schedule against the cron that fired.
          #      Correct on paper and delay-proof, but it assumes GitHub's
          #      REGISTERED schedule matches this file. It does not: the four
          #      separate entries below were pushed on Aug 6 and a day later
          #      GitHub was still firing the old combined "0 3,4,15,16 * * *",
          #      which matches no branch, so everything skipped again.
          #
          # Both tried to infer intent from the trigger. The trigger is not
          # trustworthy — its timing drifts and its identity lags the file. What
          # is trustworthy is the record of what we did: the sweep stamps
          # meta.sweepCompletedAt into data/events.json and commits it.
          #
          # So: run unless we already swept recently. The crons only have to
          # deliver at least one fire per half-day, and any of them will do.
          MIN_GAP_HOURS=8

          # A hand-triggered run counts as morning so it exercises everything,
          # metered search legs included. Deciding the slot from the clock alone
          # broke that: a dispatch at 14:11 Pacific read as evening, both search
          # legs were skipped, and the run then went red on the previous day's
          # stale seed problems. The slot is about which sweep of the day this is,
          # and a dispatch is not one of the two.
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "slot=morning" >> "$GITHUB_OUTPUT"
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch: sweeping regardless of the last run, as the morning slot."
            exit 0
          fi

          slot=morning
          [ "$(TZ=America/Los_Angeles date +%H)" -ge 14 ] && slot=evening
          echo "slot=$slot" >> "$GITHUB_OUTPUT"

          last=$(node -e "
            try {
              const m = require('./data/events.json').meta ?? {};
              const t = Date.parse(m.sweepCompletedAt ?? '');
              process.stdout.write(Number.isFinite(t) ? String(t) : '0');
            } catch { process.stdout.write('0'); }
          ")
          now=$(date +%s000)
          gap_hours=$(( (now - last) / 3600000 ))

          # A missing or unreadable stamp reads as "never swept", which runs. That
          # is the right way round: the cost of an extra sweep is a few minutes,
          # the cost of skipping is a stale board nobody is told about.
          if [ "$last" = "0" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "No usable sweepCompletedAt in data/events.json — sweeping ($slot)."
          elif [ "$gap_hours" -ge "$MIN_GAP_HOURS" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Last sweep ${gap_hours}h ago (>= ${MIN_GAP_HOURS}h) — sweeping ($slot). Trigger: '${FIRED_CRON:-dispatch}'."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping: last sweep only ${gap_hours}h ago (< ${MIN_GAP_HOURS}h). Trigger: '${FIRED_CRON:-dispatch}'."
          fi

  discover:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    # Scoped to this job rather than the whole workflow. Two of the four crons
    # are always the other timezone's and skip in about 15 seconds, but a
    # workflow-level group still enrols them — and GitHub cancels an older
    # PENDING run when a newer one joins the group. With the fires arriving
    # 50-110 minutes late they bunch together, so a skip-run could displace a
    # real sweep that was queued behind it. A skipped job never enters a
    # job-level group, so only actual sweeps serialise here.
    concurrency:
      group: discover
      cancel-in-progress: false
    # The sweep's own budget is config maxSweepMinutes, now 20 rather than the 15
    # this was first sized against, and the search and LinkedIn legs run on both
    # slots rather than one. This has to stay comfortably above the sum, because
    # the deploy is the last thing in the job and a timeout means the board does
    # not ship at all.
    timeout-minutes: 40
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: "96011880ddcfd82df7004a95257baf66"
      LUMA_API_KEY: ${{ secrets.LUMA_API_KEY }}
      # All optional, all shared by the search and LinkedIn passes, and none of
      # them load-bearing: the direct APIs (Luma, YC, Devpost, MLH) carry the board
      # and need no key at all.
      #
      # Worth knowing before adding one: the KEYLESS path returns nothing here.
      # DuckDuckGo's HTML endpoint does bot detection and this is a datacenter, so
      # it answers 403 or an empty page however politely it asks. That is specific
      # to scraping a search engine's own page — Serper and Tavily are APIs built
      # for server use and work fine from here, as does Bright Data. Any of the
      # keyed entries below fixes CI; the keyless fallback cannot.
      #
      # LinkedIn's paid per-call fallback is deliberately unreachable here — it
      # runs through the `zero` CLI, which is not installed on this runner, so no
      # CI job can spend money. That leg runs on the local schedule instead
      # (scripts/local-passes.sh), and is off by default there too.
      # Lets the Luma calendar sync and the tagging pass run here instead of only
      # on one Mac. This is a real credential — whoever holds it can act as that
      # account on Luma, not merely on one calendar — so it lives in an encrypted
      # secret and nothing ever prints it. Re-export with
      # `npm run luma:export-session | gh secret set LUMA_SESSION_COOKIES`;
      # luma.auth-session-key currently runs to September 2027.
      LUMA_SESSION_COOKIES: ${{ secrets.LUMA_SESSION_COOKIES }}
      BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
      BRIGHTDATA_SERP_ZONE: ${{ secrets.BRIGHTDATA_SERP_ZONE }}
      SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Sweep Luma and normalize events
        run: npm run discover:sf
        env:
          # Search and LinkedIn discovery both sleep between queries; keep it
          # modest in CI so they cannot eat the job's time budget.
          SEARCH_DELAY_MS: "8000"
          # Metered: every query is a Bright Data request. Ran on the morning
          # sweep only for a while, on the reasoning that the seeds are a
          # slowly-changing input. They are not that slow: search is the only
          # source that reaches events no calendar we follow links to, and a seed
          # found at 8am is a day stale by the evening crawl. Both slots now, at
          # four queries each rather than two, which is eight Bright Data
          # requests a day.
          RUN_SEARCH_LEGS: "true"
      - name: Sync events to Luma calendar (needs LUMA_API_KEY)
        if: env.LUMA_API_KEY != ''
        run: node scripts/sync-luma-calendar.mjs
      # Committed by hand rather than via git-auto-commit-action so the push
      # can rebase and retry: if another sweep (or a local push) lands while
      # this one is crawling, a plain push is rejected as non-fast-forward and
      # the whole run fails with fresh data already in hand.
      - name: Commit refreshed data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The rebase below reconciles files the local pass also writes; union
          # them instead of text-merging them. See scripts/merge-seeds.mjs.
          bash scripts/install-merge-driver.sh
          git add data
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            echo "changes_detected=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "data: refresh SF hackathon discovery"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "changes_detected=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push rejected (attempt $attempt); rebasing onto origin/main."
            if git pull --rebase --autostash origin main; then
              continue
            fi
            # A conflicted rebase stops here and returns non-zero, and this step
            # runs under `bash -e`, so before this the whole step died on the
            # first collision. The three attempts never happened: the run that
            # failed on 2026-08-25 and again on 2026-08-30 each got exactly one,
            # left a rebase mid-flight, and threw away everything the sweep had
            # just spent twenty minutes collecting.
            #
            # There is nothing here to merge. Every file that conflicts is one
            # this sweep regenerates whole, so whatever is on main is stale by
            # definition and the fresh copy simply wins. Inside a rebase
            # "theirs" is the commit being replayed, which is ours, which is why
            # that flag reads backwards. Only conflicted paths are touched, so
            # the seed files the union driver in .gitattributes already merged
            # are left exactly as it merged them.
            conflicts="$(git diff --name-only --diff-filter=U)"
            if [ -z "$conflicts" ]; then
              git rebase --abort || true
              echo "Rebase failed with nothing conflicted; giving up." >&2
              exit 1
            fi
            echo "Resolving in favour of this sweep: $conflicts"
            git checkout --theirs -- $conflicts
            git add -- $conflicts
            GIT_EDITOR=true git rebase --continue
          done
          echo "Could not push after 3 attempts." >&2
          exit 1
      # Validate the artifact BEFORE promoting it. Until now the only check ran
      # after the deploy, so a board that was wrong-but-not-collapsed shipped and
      # we found out afterwards. If this fails the job stops here, nothing is
      # promoted, and the live site keeps serving the last version that passed.
      #
      # Deliberately test:artifact and not the whole suite. This gate answers one
      # question — is the thing we are about to publish correct — and the browser
      # tests that drive Luma's form answer a different one. A flaky Chrome in a
      # sync test must not be able to stop the site from updating.
      #
      # The data commit above stays: it is the record of what the sweep found, and
      # is worth keeping even when the render of it is broken.
      - name: Validate the built board and feed
        run: npm run test:artifact
      # Deploy on its own merits: the site should reflect the sweep even when a
      # concurrent run already committed identical data.
      #
      # `npm run deploy` and not `vinext deploy`, because the latter ships
      # whatever is already in dist. This job happens to build during the test
      # step above, so it was correct by accident; deploying by hand was not, and
      # shipped a Worker whose HTML asked for /assets/page-CHDNf3Bh.js while the
      # uploaded assets were page-LedHCZM5.js. Every one of those returned 404,
      # so the page could not hydrate: the server-rendered list still showed but
      # search and every filter were dead. The extra build costs a few seconds
      # and removes the whole class.
      - name: Deploy site + calendar feed (needs CLOUDFLARE_API_TOKEN)
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm run deploy
      # Last, and deliberately after the deploy. Every discovery pass is built to
      # exit 0 whatever happens, so a source can die and the pipeline keeps
      # publishing yesterday's answer in silence — which is exactly what happened
      # to web search. This step is the alarm: it never blocks the board from
      # updating, it just turns the run red so a dead source is visible.
      # Mirror the board onto the Luma calendar. Runs here only when the session
      # secret is present; otherwise it stays a local-only pass as before.
      #
      # After the deploy on purpose. The site and the feed are the product and
      # must not wait on a browser driving somebody else's admin UI, and this step
      # is allowed to fail without taking the run down — the sync is idempotent and
      # loses no queue state, so the next run simply picks up where it stopped.
      - name: Mirror the board onto the Luma calendar
        if: env.LUMA_SESSION_COOKIES != ''
        continue-on-error: true
        env:
          CHROME_PATH: /usr/bin/google-chrome
        # One calendar per region, named in config/discovery.json. A region whose
        # calendar does not exist on the account yet says so and the next region
        # still runs, which is why each line carries its own `|| true`.
        run: |
          for region in $(node -e "const c=require('./config/discovery.json'); console.log(Object.entries(c.regions ?? {}).filter(([, r]) => r.lumaCalendarName).map(([k]) => k).join(' '))"); do
            node scripts/luma-sync-ui.mjs --headless --region "$region" || true
            node scripts/luma-tag-events.mjs --headless --region "$region" || true
          done
      - name: Commit the sync ledger
        if: env.LUMA_SESSION_COOKIES != ''
        continue-on-error: true
        run: |
          git add data/luma-ledger.json data/luma-tags.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: refresh Luma calendar sync state"
          for attempt in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase --autostash origin main
          done
      # The rest of the suite, after the deploy: it exercises the form-filling
      # driver against a local fixture, which is worth knowing about but is not a
      # reason to withhold a correct board.
      - name: Test the Luma form driver
        continue-on-error: true
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run test:browser
      - name: Check source health
        id: health
        # pipefail matters: without it the step takes tee's exit status and a
        # failing health check would report success, which is the exact bug this
        # check exists to catch.
        run: |
          set -o pipefail
          npm run check:sources 2>&1 | tee /tmp/health.txt
      # A red run only helps if someone finds out. GitHub's own workflow-failure
      # email depends on per-account settings and, for scheduled runs, on who last
      # touched the workflow file — too conditional to rely on. An issue is
      # unconditional: it emails, it pushes to the GitHub mobile app, and it
      # leaves a record that persists after the run logs age out.
      #
      # One issue, reused. A fresh issue twice a day for the same broken source
      # would train you to ignore it, so a run appends a comment to the open one
      # and only files a new one when none is open.
      - name: Report a red run
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +e
          detail=$(tail -40 /tmp/health.txt 2>/dev/null)
          [ -z "$detail" ] && detail="The run failed before the health check — see the run log. A refused publish (collapsed board) looks like this."
          body=$(printf 'The discovery pipeline failed.\n\nRun: %s\n\n```\n%s\n```\n\nThe live board is unaffected: a collapsed sweep is refused before publishing, and the health check runs after the deploy.\n' "$RUN_URL" "$detail")
          existing=$(gh issue list --state open --label pipeline-red --limit 1 --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh label create pipeline-red --color b60205 --description "Discovery pipeline failed" 2>/dev/null
            gh issue create --title "Discovery pipeline is red" --label pipeline-red --body "$body"
          fi
          exit 0
