name: SF hackathon discovery

on:
  workflow_dispatch:
  schedule:
    # Fires at every UTC hour that can be 8am or 8pm Pacific across PST/PDT;
    # the gate job below keeps only the runs where it actually is.
    - cron: "0 3,4,15,16 * * *"

concurrency:
  group: discover
  cancel-in-progress: false

permissions:
  contents: write
  # The failure notifier below files an issue, which is what actually reaches a
  # phone. Without this it silently cannot.
  issues: write

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
      slot: ${{ steps.check.outputs.slot }}
    steps:
      - name: Only proceed at 8am/8pm Pacific (or manual dispatch)
        id: check
        run: |
          hour=$(TZ=America/Los_Angeles date +%H)
          # The slot decides whether the metered search legs run: they cost real
          # requests and seeds barely change within a day, while the sweep itself
          # is worth running twice. Manual dispatch counts as morning so a
          # hand-triggered run exercises everything.
          if [ "$hour" = "20" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "slot=evening" >> "$GITHUB_OUTPUT"
          else
            echo "slot=morning" >> "$GITHUB_OUTPUT"
          fi
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$hour" = "08" ] || [ "$hour" = "20" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping: $hour:00 Pacific is not a sweep slot."
          fi

  discover:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    # The sweep's own budget is 15 minutes (config maxSweepMinutes); this must
    # stay comfortably above it so a full-length sweep still gets to deploy.
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: "96011880ddcfd82df7004a95257baf66"
      LUMA_API_KEY: ${{ secrets.LUMA_API_KEY }}
      # All optional, all shared by the search and LinkedIn passes, and none of
      # them load-bearing: the direct APIs (Luma, YC, Devpost) carry the board
      # and need no key at all.
      #
      # Worth knowing before adding one: the KEYLESS path returns nothing here.
      # DuckDuckGo's HTML endpoint does bot detection and this is a datacenter, so
      # it answers 403 or an empty page however politely it asks. That is specific
      # to scraping a search engine's own page — Serper and Tavily are APIs built
      # for server use and work fine from here, as does Bright Data. Any of the
      # keyed entries below fixes CI; the keyless fallback cannot.
      #
      # LinkedIn's paid per-call fallback is deliberately unreachable here — it
      # runs through the `zero` CLI, which is not installed on this runner, so no
      # CI job can spend money. That leg runs on the local schedule instead
      # (scripts/local-passes.sh), and is off by default there too.
      BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
      BRIGHTDATA_SERP_ZONE: ${{ secrets.BRIGHTDATA_SERP_ZONE }}
      SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Sweep Luma and normalize events
        run: npm run discover:sf
        env:
          # Search and LinkedIn discovery both sleep between queries; keep it
          # modest in CI so they cannot eat the job's time budget.
          SEARCH_DELAY_MS: "8000"
          # Metered: every query is a Bright Data request. Run them on the morning
          # sweep only — the seeds they produce are a slowly-changing input, and
          # the evening sweep crawls whatever the morning found. Halves the spend
          # for no loss of board freshness, since the sweep still runs twice.
          RUN_SEARCH_LEGS: ${{ needs.gate.outputs.slot == 'morning' }}
      - name: Sync events to Luma calendar (needs LUMA_API_KEY)
        if: env.LUMA_API_KEY != ''
        run: node scripts/sync-luma-calendar.mjs
      # Committed by hand rather than via git-auto-commit-action so the push
      # can rebase and retry: if another sweep (or a local push) lands while
      # this one is crawling, a plain push is rejected as non-fast-forward and
      # the whole run fails with fresh data already in hand.
      - name: Commit refreshed data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            echo "changes_detected=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "data: refresh SF hackathon discovery"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "changes_detected=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push rejected (attempt $attempt); rebasing onto origin/main."
            git pull --rebase --autostash origin main
          done
          echo "Could not push after 3 attempts." >&2
          exit 1
      # Deploy on its own merits: the site should reflect the sweep even when a
      # concurrent run already committed identical data.
      - name: Deploy site + calendar feed (needs CLOUDFLARE_API_TOKEN)
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx vinext deploy
      # Last, and deliberately after the deploy. Every discovery pass is built to
      # exit 0 whatever happens, so a source can die and the pipeline keeps
      # publishing yesterday's answer in silence — which is exactly what happened
      # to web search. This step is the alarm: it never blocks the board from
      # updating, it just turns the run red so a dead source is visible.
      - name: Check source health
        id: health
        # pipefail matters: without it the step takes tee's exit status and a
        # failing health check would report success, which is the exact bug this
        # check exists to catch.
        run: |
          set -o pipefail
          npm run check:sources 2>&1 | tee /tmp/health.txt
      # A red run only helps if someone finds out. GitHub's own workflow-failure
      # email depends on per-account settings and, for scheduled runs, on who last
      # touched the workflow file — too conditional to rely on. An issue is
      # unconditional: it emails, it pushes to the GitHub mobile app, and it
      # leaves a record that persists after the run logs age out.
      #
      # One issue, reused. A fresh issue twice a day for the same broken source
      # would train you to ignore it, so a run appends a comment to the open one
      # and only files a new one when none is open.
      - name: Report a red run
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +e
          detail=$(tail -40 /tmp/health.txt 2>/dev/null)
          [ -z "$detail" ] && detail="The run failed before the health check — see the run log. A refused publish (collapsed board) looks like this."
          body=$(printf 'The discovery pipeline failed.\n\nRun: %s\n\n```\n%s\n```\n\nThe live board is unaffected: a collapsed sweep is refused before publishing, and the health check runs after the deploy.\n' "$RUN_URL" "$detail")
          existing=$(gh issue list --state open --label pipeline-red --limit 1 --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh label create pipeline-red --color b60205 --description "Discovery pipeline failed" 2>/dev/null
            gh issue create --title "Discovery pipeline is red" --label pipeline-red --body "$body"
          fi
          exit 0
